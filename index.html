cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipRadar 59/62 — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8 font-sans">

  <!-- Header -->
  <header class="max-w-6xl mx-auto mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4 border-b border-slate-800 pb-5">
    <div>
      <h1 class="text-3xl font-extrabold tracking-tight text-white flex items-center gap-2">
        ⚡ FlipRadar <span class="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0,5 rounded-full">Secteur 59/62</span>
      </h1>
      <p class="text-slate-400 text-sm mt-1">Objectif : 80 € ➔ 1 000 € | Détection en temps réel</p>
    </div>
    <div id="stats" class="text-sm bg-slate-800/80 border border-slate-700/50 px-4 py-2 rounded-xl text-slate-300">
      Chargement des affaires...
    </div>
  </header>

  <!-- Grille d'annonces -->
  <main class="max-w-6xl mx-auto">
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Les cartes s'affichent ici -->
    </div>
    <div id="empty-state" class="hidden text-center py-20 text-slate-500">
      Aucune pépite détectée pour le moment. Le robot cherche dans le 59 et le 62...
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://bxhaiycfywkjhruhzdmp.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ4aGFpeWNmeXdramhydWh6ZG1wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMDM0NTQsImV4cCI6MjEwNTU3OTQ1NH0.6JeOlH5QHeLhmP_V66dARMTWaj5Xhwhurv4M_l8ogLU";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function chargerAnnonces() {
      const { data, error } = await db
        .from('annonces')
        .select('*')
        .order('created_at', { ascending: false });

      const grid = document.getElementById('grid');
      const emptyState = document.getElementById('empty-state');
      const stats = document.getElementById('stats');

      if (error || !data || data.length === 0) {
        grid.innerHTML = '';
        emptyState.classList.remove('hidden');
        stats.innerText = '0 opportunité trouvée';
        return;
      }

      emptyState.classList.add('hidden');
      
      const totalMarge = data.reduce((acc, ad) => acc + (ad.marge_estimee || 0), 0);
      stats.innerHTML = `<b class="text-white">${data.length}</b> pépites | Potentiel : <b class="text-emerald-400">+${totalMarge} €</b>`;

      grid.innerHTML = data.map(ad => `
        <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl overflow-hidden shadow-lg hover:border-slate-500 transition duration-200 flex flex-col">
          
          <!-- Image + Badge Marge -->
          <div class="relative h-48 bg-slate-900 w-full overflow-hidden">
            <img src="${ad.image_url || 'https://via.placeholder.com/400x300?text=Pas+d%27image'}" 
                 alt="${ad.titre}" 
                 class="w-full h-full object-cover">
            <div class="absolute top-3 right-3 bg-emerald-500 text-slate-950 font-black px-3 py-1 rounded-full text-sm shadow-md">
              +${ad.marge_estimee} €
            </div>
          </div>

          <!-- Contenu -->
          <div class="p-5 flex-1 flex flex-col justify-between">
            <div>
              <h2 class="font-semibold text-lg text-white leading-snug line-clamp-2">${ad.titre}</h2>
              <p class="text-xs text-slate-400 mt-1 line-clamp-1">${ad.analyse_ia || 'Hauts-de-France'}</p>
            </div>

            <!-- Prix -->
            <div class="mt-4 pt-4 border-t border-slate-700/50 flex justify-between items-center text-sm">
              <div>
                <span class="text-slate-400 block text-xs">Achat</span>
                <span class="font-bold text-white text-base">${ad.prix_achat} €</span>
              </div>
              <div class="text-right">
                <span class="text-slate-400 block text-xs">Revente stimée</span>
                <span class="font-semibold text-slate-300">${ad.prix_revente_estime} €</span>
              </div>
            </div>

            <!-- Bouton Leboncoin -->
            <a href="${ad.url}" target="_blank" rel="noopener" 
               class="mt-4 w-full text-center bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2,5 rounded-xl transition duration-150 block text-sm">
              Voir sur Leboncoin ↗
            </a>
          </div>
        </div>
      `).join('');
    }

    chargerAnnonces();
    setInterval(chargerAnnonces, 30000); // Rafraîchissement automatique toutes les 30s
  </script>
</body>
</html>
EOF
